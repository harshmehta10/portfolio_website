<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/user1.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter stands in for Sohne (proprietary). Loaded without blocking first
         paint; display=swap shows the system fallback until it arrives. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harsh Mehta, frontend developer working in React, Tailwind CSS and Firebase. Selected projects, background and contact."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Harsh Mehta</title>
  </head>
  <body>
    <script>
      // Runs before first paint so the page never flashes the wrong theme:
      // a saved choice wins, otherwise follow the OS.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
